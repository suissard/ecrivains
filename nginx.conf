server {
    listen 80;
    server_name localhost;

    # Root directory of the build output
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Support single-page application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy webhook requests to n8n if needed (matches vite.config.js dev proxy)
    location /n8n-proxy/ {
        proxy_pass https://n8n.clavier.dev/;
        proxy_set_header Host n8n.clavier.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSL settings for proxying to HTTPS target
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";
}
